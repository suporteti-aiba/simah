# Publica a imagem do SIMAH no GHCR e, num push na alfa, sobe o QA.
#
# main: publica as tags `latest` e `sha-<commit>`. Este workflow NÃO conecta na
# VM da AIBA: o modelo antigo (deploy_production, scp + ssh) fazia o runner da
# GitHub conectar de fora para dentro, o que exige SSH exposto à internet, coisa
# que datacenter corporativo não permite. Aqui o fluxo inverte: publicamos a
# imagem e a VM a busca, iniciando a conexão de dentro para fora (ver item 6 do
# DRT-SIMAH-001). Na VM: ./deploy.sh sha-<commit>
#
# alfa: publica as tags `alfa` e `sha-<commit>` e o job "Publica no QA" sobe essa
# mesma imagem em https://simah.studio1.tech, no servidor da Studio1. O QA roda,
# portanto, exatamente a imagem que depois vai para a AIBA.

name: Build and Publish Image

on:
  push:
    branches:
      - main
      - alfa
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag adicional para a imagem (opcional)'
        required: false

# Dois pushes seguidos na mesma branch não publicam em paralelo: o segundo
# espera o primeiro terminar, para o QA nunca ficar com a imagem mais velha.
concurrency:
  group: imagem-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` só na main: a branch padrão do repositório é a alfa, então o
      # `is_default_branch` de antes marcaria como latest a imagem de QA.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=alfa,enable=${{ github.ref == 'refs/heads/alfa' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # O cache do GitHub Actions evita reinstalar GDAL, JRE e Python a
          # cada build; sem ele o build leva vários minutos.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Imagem publicada"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Para implantar na VM da AIBA:"
            echo ""
            echo '```bash'
            echo "./deploy.sh sha-$(git rev-parse --short HEAD)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-qa:
    name: Publica no QA (simah.studio1.tech)
    needs: build
    # Só no repositório da Studio1: o do cliente recebe este arquivo pelo merge
    # alfa -> aiba-main e não tem (nem deve ter) acesso ao servidor do QA.
    if: github.repository == 'studio1-tech/simah-web' && github.event_name == 'push' && github.ref == 'refs/heads/alfa'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    environment:
      name: alfa
      url: https://simah.studio1.tech

    steps:
      # A chave e a host key do servidor ficam no environment `alfa`, que só a
      # branch alfa enxerga. No servidor a chave está presa a um único comando
      # (restrict,command= no authorized_keys): não abre shell nem túnel, e só
      # aceita o SHA de um commit que esteja na alfa.
      #
      # O GITHUB_TOKEN deste job vai pelo stdin e serve só para o servidor baixar
      # a imagem do GHCR: vale enquanto o job roda, então nenhuma credencial do
      # registro fica guardada no servidor.
      #
      # Até 3 tentativas quando o ssh devolve 255 (não conectou ou a conexão
      # caiu): no merge do PR #10 a primeira conexão deu timeout na porta 22 e a
      # segunda passou. Qualquer outro código é do próprio deploy e encerra o
      # job. Repetir é seguro: no servidor o deploy roda numa sessão própria com
      # lock, então uma tentativa nova espera a anterior e republica o mesmo
      # commit, o que não troca nada.
      - name: Deploy no servidor
        env:
          SSH_KEY: ${{ secrets.ALFA_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ALFA_SSH_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/alfa
          chmod 600 ~/.ssh/alfa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          for tentativa in 1 2 3; do
            status=0
            printf '%s\n' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/alfa -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ConnectTimeout=30 -o ServerAliveInterval=30 root@ssh.studio1.tech "$GITHUB_SHA" || status=$?
            [ "$status" -ne 255 ] && exit "$status"
            if [ "$tentativa" -lt 3 ]; then
              echo "::warning::ssh devolveu 255 na tentativa $tentativa de 3; nova tentativa em $((tentativa * 30)) s"
              sleep $((tentativa * 30))
            fi
          done
          echo "::error::ssh não conectou ao servidor do QA em 3 tentativas"
          exit 255
